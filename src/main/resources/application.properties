spring.application.name=nhi-crawler

# Spring Boot Email (Gmail SMTP) 設定
# 請於本機或部署環境設定環境變數 GMAIL_USERNAME 與 GMAIL_APP_PASSWORD
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

# 安全性設定 (Gmail 強制要求開啟加密傳輸)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 爬蟲與收件人設定（可選，未設定時預設使用上方預設值）
nhi.chrome.debugger-address=${NHI_CHROME_DEBUGGER_ADDRESS:127.0.0.1:9222}
nhi.mail.recipient=${NHI_MAIL_RECIPIENT:${GMAIL_USERNAME}}
